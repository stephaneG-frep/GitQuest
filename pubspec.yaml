publish_to: none
version: 1.2.0+3

environment:
  sdk: ^3.9.0

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
